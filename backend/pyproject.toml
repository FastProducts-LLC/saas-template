[project]
name = "backend"
version = "0.1.0"
description = "SaaS Template backend — FastAPI, DDD vertical slices, multi-tenant, Stripe billing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
    "stripe>=16.0",
    "boto3>=1.43",
    "aiosmtplib>=5.1",
    "resend[async]>=2.53",
    "redis>=8.0",
    "celery[redis]>=5.7",
    "slowapi>=0.1.10",
    "google-genai>=3.0",
    "openai>=3.0",
    "anthropic>=2.0",
    "sentry-sdk[fastapi]>=2.74",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Everything shares one event loop: asyncpg connections are loop-bound, so the
# session-scoped engine and the tests must run on the same loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are historical artifacts — autogenerated, never edited after
# they ship — so they're exempt from lint/format churn.
# Generated modules (scripts/gen_*.py) are owned by their generators; editing
# or reformatting them by hand would fail the generators' --check in CI.
extend-exclude = [
    "alembic/versions",
    "app/core/brand.py",
    "app/core/error_codes.py",
    "app/core/policy.py",
    "app/domains/analytics/domain/events.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
# UP042 (str+Enum → StrEnum) is intentionally off: str(member) differs between
# the two ("Plan.FREE" vs "free"), so a blanket rewrite risks silent behavior
# changes in f-strings/logs. Revisit deliberately, not via autofix.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/gen_errors.py — long catalog strings are fine.
"app/core/error_codes.py" = ["E501"]
# Inline-styled HTML email markup; wrapping it would hurt readability.
"app/core/email/layout.py" = ["E501"]
# Tests assert freely and hardcode throwaway credentials.
"tests/**" = ["S101", "S105", "S106", "S110"]
"scripts/**" = ["S106"]
