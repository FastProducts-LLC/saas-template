name: Feature request
description: Suggest a module or improvement for the template.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Which slice(s) it touches, and whether it should sit behind a feature flag or an entitlement.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
