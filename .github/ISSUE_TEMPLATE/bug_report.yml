name: Bug report
description: Something in the template doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Frontend, Mobile, Deploy / CI, Docs, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA
      description: Output of `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove secrets and personal data first. The `X-Request-ID` / error id helps.
      render: shell
