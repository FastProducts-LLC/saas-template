# Substituted at container start by the nginx entrypoint (envsubst):
# only defined env vars (${BACKEND_URL}) are replaced; nginx runtime
# vars ($host, $uri, ...) are left intact.
server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user
    # that cannot bind ports below 1024.
    listen 8080;
    # Don't advertise the nginx version in Server headers / error pages.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers. `always` so they're sent on error responses
    # too. The Content-Security-Policy is deliberately NOT set here — it lives
    # in the Caddy vhost (caddy.d/myapp.caddy) so one policy covers the SPA
    # and /api/* alike; two CSP headers would intersect in the browser.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # nginx gotcha: a location that declares ANY add_header stops inheriting
    # the four above — so every such location below repeats them. Keep the
    # copies in sync when you change one.

    # Re-resolve the backend hostname through Docker's internal DNS on every
    # request (valid=10s). Without this nginx pins the IP it resolved at
    # startup, which 502s after a start-first rolling update replaces the
    # backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API proxy — mirrors the Vite dev-server proxy so
    # cookies keep working in production. (Behind Caddy this block is a
    # fallback: docker-compose.prod.yml routes /api to the backend directly.)
    location /api/ {
        set $backend_upstream ${BACKEND_URL};
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routing.
    # Static files under /docs/*.md and /llms.txt are served as-is (LLM-friendly
    # API docs) before falling back to the SPA for /docs.
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ~* ^/docs/.*\.(md|txt)$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
