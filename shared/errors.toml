# ---------------------------------------------------------------- server & infrastructure

[ERR_SRV_001]
title = "Internal server error"
status = 500
severity = "critical"
display = "toast"
user_message = "Something went wrong on our end. Your data is safe, and we've been notified."
action_step = "Try again in a few moments. If it keeps happening, contact support and mention the code shown below."
technical_context = "Catch-all for unhandled exceptions. The handler logs the full traceback against the error_id and returns ONLY this envelope — never exception text. 'Your data is safe' is honest because get_db rolls back the transaction on failure."
alert = "Any sustained rate is an incident. Fingerprint by error_id lookup, not by user reports."

[ERR_SRV_002]
title = "Request timed out"
status = 504
severity = "error"
display = "toast"
retry = { after_ms = 2000, max = 2 }
user_message = "This is taking longer than expected."
action_step = "Wait a moment and try again — your previous attempt may still finish on its own."
technical_context = "Upstream/gateway timeout (frontend-mapped from bodyless 502/504). Retrying a mutation is safe ONLY because the api client attaches an Idempotency-Key and reuses it on retry."

[ERR_SRV_003]
title = "Maintenance in progress"
status = 503
severity = "warning"
display = "page"
user_message = "We're doing some quick maintenance and will be right back."
action_step = "Nothing to fix on your end — this page will refresh itself when we're done."
technical_context = "Deliberate maintenance mode or healthcheck-failed state at the proxy (frontend-mapped from a bodyless 503). The frontend shows a full-page takeover and polls /api/health with backoff, reloading when it recovers."

[ERR_SRV_004]
title = "Duplicate request in progress"
status = 409
severity = "info"
display = "toast"
user_message = "We're still working on your previous attempt at this."
action_step = "Give it a few seconds — the first attempt should finish on its own."
technical_context = "Idempotency middleware: a second request arrived with the same Idempotency-Key while the first was still in flight. Usually a double-click or an aggressive client retry."

