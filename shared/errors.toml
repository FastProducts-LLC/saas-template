# Error catalog — THE single source of truth for every error in the system.
#
# Regenerate the derived files after any change here:
#   python3 scripts/gen_errors.py
# CI drift check:
#   python3 scripts/gen_errors.py --check
#
# Generates:
#   backend/app/core/error_codes.py   (code -> status/severity/title/user_message)
#   frontend/src/lib/errorCatalog.ts  (full UX copy + display routing + retry policy)
#   docs/errors.md                    (support lookup table, incl. technical context)
#
# Fields per code:
#   title             short human summary (RFC 9457 `title`)
#   status            HTTP status (0 = frontend-only, never sent by the backend)
#   severity          info | warning | error | critical  (drives log level + toast styling)
#   display           field | toast | banner | page      (default frontend surface)
#   user_message      friendly, jargon-free explanation shown to the user
#   action_step       what the user should do next
#   technical_context developer note — never crosses the wire, lives in docs + logs
#   retry             optional { after_ms, max } — frontend auto-retry policy
#   alert             optional ops note: what a spike/sustained rate of this code means
#   frontend_only     optional bool — synthesized by the frontend, no backend mapping
#   params            optional list of names the backend may send via
#                     `AppError(params={...})` (envelope `params`). Values are
#                     identifiers/numbers only — never PII or free text.
#   user_message_specific  required with params: user_message with `{name}`
#                     placeholders. Clients show it only when EVERY param has a
#                     value, else fall back to the plain user_message.
#
# GOVERNANCE: codes are permanent. Never reuse or renumber — mark dead codes
# with `deprecated = true` instead (kept in the frontend catalog so old cached
# bundles still render them).

# ---------------------------------------------------------------- generic request

[ERR_REQ_001]
title = "Request could not be processed"
status = 400
severity = "warning"
display = "toast"
user_message = "We couldn't process that request."
action_step = "Try again. If it keeps happening, contact support and mention the code shown below."
technical_context = "Base AppError fallback — a slice raised AppError directly instead of a specific subclass. Treat occurrences as a prompt to define a dedicated code."

[ERR_REQ_002]
title = "Not found"
status = 404
severity = "info"
display = "toast"
user_message = "We couldn't find that page or it may have been removed."
action_step = "Check the link, or head back to your dashboard."
technical_context = "Generic NotFoundError or an unmatched route (Starlette 404/405 are mapped here too)."

[ERR_REQ_003]
title = "Conflict"
status = 409
severity = "info"
display = "toast"
user_message = "That change conflicts with the current state of your data."
action_step = "Refresh to see the latest version, then try again."
technical_context = "Generic ConflictError fallback. Prefer a specific code (ERR_VAL_006 for stale writes, ERR_ORG_*/ERR_BILL_* for domain conflicts)."

[ERR_REQ_004]
title = "Too many requests"
status = 429
severity = "warning"
display = "toast"
user_message = "You're doing that a little too fast, so we've paused things briefly."
action_step = "Wait a moment, then try again."
technical_context = "RateLimited raised by a rate-limiting dependency (Redis sliding window — provisioned but opt-in). Retry-After is set when known; the frontend disables the triggering control until it elapses."
alert = "Burst from a single IP/user on /auth/login = credential stuffing attempt."

[ERR_REQ_005]
title = "Payload too large"
status = 413
severity = "info"
display = "toast"
user_message = "That file or request is too large for us to accept."
action_step = "Try something smaller, or compress the file first."
technical_context = "Frontend-mapped from a (often bodyless) 413 — usually rejected by the proxy before reaching FastAPI, so no problem+json body exists."

# ---------------------------------------------------------------- validation

[ERR_VAL_001]
title = "Validation failed"
status = 422
severity = "info"
display = "field"
user_message = "Some of the information looks incomplete or incorrect."
action_step = "Check the highlighted fields and try again."
technical_context = "Pydantic schema validation failed at the router boundary. The handler flattens pydantic's loc list into the envelope's `fields` map (keys are dotted body paths, with the body/query/path prefix dropped) and rewrites pydantic's messages into plain sentences (`friendly_field_message` in app.core.error_handling). Custom validator ValueErrors pass through minus pydantic's 'Value error, ' prefix, so write them as user-facing copy."
alert = "Concentrated on one field right after a deploy = frontend/backend schema drift."

[ERR_VAL_002]
title = "Email already registered"
status = 409
severity = "info"
display = "field"
user_message = "An account with this email already exists."
action_step = "Try signing in instead, or use 'Forgot password' if you don't remember it."
technical_context = "EmailAlreadyRegistered from AuthService.register (caught before the unique constraint fires). Only raised when SIGNUP_ENUMERATION_PROTECTION is off (the default): a deliberate enumeration trade-off for one-step signup, bounded by the register rate limit. With it on, register answers 202 verification_required either way, the existing owner gets a notice email, and this error never fires."

[ERR_VAL_003]
title = "Password too weak"
status = 400
severity = "info"
display = "field"
user_message = "That password is too easy to guess."
action_step = "Use at least 12 characters with a mix of letters and numbers, avoiding common passwords."
technical_context = "PasswordTooWeak — validate_password_strength failed (too short, missing letter/digit mix, or on the common-password blocklist). Min length is PASSWORD_MIN_LENGTH in auth/domain/services.py (mirrored in frontend password-policy)."

[ERR_VAL_004]
title = "Passwords do not match"
status = 400
severity = "info"
display = "field"
user_message = "The two passwords you entered don't match."
action_step = "Re-type both passwords so they match exactly."
technical_context = "PasswordMismatch from AuthService.register. Normally caught client-side first; reaching the backend implies JS-less submission or a frontend bug."

[ERR_VAL_005]
title = "Terms not accepted"
status = 400
severity = "info"
display = "field"
user_message = "You'll need to accept the Terms of Service and Privacy Policy to create an account."
action_step = "Tick the agreement checkbox, then try again."
technical_context = "TermsNotAccepted from AuthService.register — terms_accepted was false at the API boundary."

[ERR_VAL_006]
title = "Edit conflict"
status = 409
severity = "info"
display = "toast"
user_message = "Someone else changed this just now, so we didn't save your edits to avoid overwriting theirs."
action_step = "Refresh to see the latest version, then re-apply your changes."
technical_context = "StaleWriteError — optimistic concurrency failure (stale version/updated_at on write). Log both versions' timestamps and the conflicting user_id. Defined in core for slices to adopt."

# ---------------------------------------------------------------- auth

[ERR_AUTH_001]
title = "Invalid credentials"
status = 401
severity = "info"
display = "field"
user_message = "That email and password combination didn't match our records."
action_step = "Double-check both fields and try again, or use 'Forgot password' to reset it."
technical_context = "InvalidCredentials from AuthService.login: user not found OR argon2 verify failed — logged identically for both to prevent user-enumeration timing analysis."

[ERR_AUTH_002]
title = "Session expired"
status = 401
severity = "info"
display = "page"
user_message = "Your session has ended, so we signed you out to keep your account safe."
action_step = "Sign in again to pick up where you left off."
technical_context = "SessionExpired on the refresh path: cookie missing, token expired (>30d), or hash mismatch after rotation (possible reuse/theft — the token family is revoked). Surfaces when the frontend's transparent tryRefresh() fails; the auth context then signs the user out."

[ERR_AUTH_003]
title = "Could not verify sign-in"
status = 401
severity = "warning"
display = "toast"
user_message = "We couldn't verify your sign-in."
action_step = "Refresh the page. If you're still stuck, sign out and back in."
technical_context = "Generic AuthenticationError from auth deps: missing bearer, malformed/bad-signature JWT, or inactive user — distinct from simple expiry (silently refreshed). Often clock skew or a SECRET_KEY mismatch across instances."
alert = "Spike right after a deploy = SECRET_KEY mismatch between instances — roll back."

[ERR_AUTH_004]
title = "Link invalid or expired"
status = 400
severity = "info"
display = "page"
user_message = "This link is no longer valid — it may have expired or already been used."
action_step = "Request a fresh link and use it soon after it arrives."
technical_context = "InvalidActionToken: a purpose-scoped action JWT (email verification or password reset) failed decode, expired, had a purpose mismatch, or the password-reset fingerprint no longer matches (link already used, or the password changed after it was issued). TTLs: EMAIL_VERIFICATION_TTL_HOURS / PASSWORD_RESET_TTL_MINUTES."

[ERR_AUTH_005]
title = "Email not verified"
status = 403
severity = "info"
display = "toast"
user_message = "Confirm your email address before continuing."
action_step = "Check your inbox for the verification link, or resend it from your profile."
technical_context = "EmailNotVerified — EMAIL_VERIFICATION_GATE is sensitive/login and the session user has email_verified_at IS NULL. CurrentVerifiedUser (and LoginUser when gate=login) raise this. API-key callers are not gated. Flip the gate in Settings / env per project."

[ERR_AUTH_006]
title = "Account temporarily locked"
status = 429
severity = "warning"
display = "field"
user_message = "Too many failed sign-in attempts, so sign-in for this account is paused briefly."
action_step = "Wait about 15 minutes and try again, or reset your password now via 'Forgot password'."
technical_context = "AccountTemporarilyLocked from LoginUser: LOGIN_LOCKOUT_MAX_ATTEMPTS consecutive failures within LOGIN_LOCKOUT_WINDOW_MINUTES from one client IP lock that email for that IP only; LOGIN_LOCKOUT_ACCOUNT_MAX_ATTEMPTS failures across all IPs lock the email for everyone. Both are tracked whether or not the account exists (no enumeration signal); a completed password reset lifts the lock. Redis-backed; on a Redis outage it degrades to a per-process in-memory counter (never fully open). Retry-After carries the remaining lock seconds."
alert = "A spike here = credential-stuffing campaign — query audit_events for auth.lockout_triggered grouped by ip. meta.scope=account means an email was locked for every client, its owner included (distributed guessing or a targeted lockout)."

[ERR_AUTH_007]
title = "Not available while impersonating"
status = 403
severity = "warning"
display = "toast"
user_message = "This action isn't available while you're viewing the app as another user."
action_step = "End the impersonation session and ask the account owner to do this themselves."
technical_context = "ImpersonationNotAllowed from forbid_impersonation (auth/interface/deps.py): the access token carries an `imp` claim (admin impersonation session) and the route creates or changes a credential that would outlive the 15-minute session (password change, API key creation). Impersonation is for looking, not for minting persistent access."

# ---------------------------------------------------------------- permissions & tenancy

[ERR_PERM_001]
title = "Permission denied"
status = 403
severity = "info"
display = "toast"
user_message = "You don't have permission to do that in this organization."
action_step = "Ask an organization admin to upgrade your role, or switch to an organization where you have access."
technical_context = "InsufficientRole (or base PermissionDeniedError): require_role() passed the membership check but the role rank was insufficient. Log includes org_id, user_id, required vs. actual role."

[ERR_PERM_002]
title = "Not found"
status = 404
severity = "warning"
display = "toast"
user_message = "We couldn't find that page or it may have been removed."
action_step = "Check the link, or head back to your dashboard."
technical_context = "OrganizationNotFound — deliberate 404-masking per multi-tenancy rule #2: the user is NOT a member of the requested org, and org existence must never leak. The internal log records the real reason; the user copy is identical to a plain 404."
alert = "Burst from one user across many org_ids = tenant-enumeration probing — security signal."

[ERR_PERM_003]
title = "Invitation invalid"
status = 404
severity = "info"
display = "page"
user_message = "This invitation is no longer valid."
action_step = "Ask the person who invited you to send a new invitation."
technical_context = "InvitationInvalid: token expired (>7d), already accepted, or revoked. Log which of the three — a high expired rate suggests the TTL is too short."

[ERR_PERM_004]
title = "Administrator access required"
status = 403
severity = "warning"
display = "page"
user_message = "This area is for platform administrators."
action_step = "Head back to your dashboard. If you believe you should have access, contact an existing administrator."
technical_context = "NotSuperuser from get_current_superuser — a signed-in non-superuser hit an /admin route. is_superuser is only granted manually in the database."
alert = "Repeated hits from one user = someone probing the admin surface."

# ---------------------------------------------------------------- organizations

[ERR_ORG_001]
title = "Last owner"
status = 409
severity = "info"
display = "toast"
user_message = "An organization needs at least one owner, and this is the only one."
action_step = "Make someone else an owner first, then try again."
technical_context = "LastOwnerError — attempted to demote/remove the sole owner. Raised by OrganizationService role-change/removal paths."

[ERR_ORG_002]
title = "Already a member"
status = 409
severity = "info"
display = "toast"
user_message = "That person is already a member of this organization."
action_step = "Nothing to do — they already have access. Check the Members page."
technical_context = "AlreadyMember — invitation or acceptance for a user who already holds a membership in the org."

[ERR_ORG_003]
title = "Member not found"
status = 404
severity = "info"
display = "toast"
user_message = "We couldn't find that member in this organization."
action_step = "Refresh the Members page — they may have already been removed."
technical_context = "MemberNotFound — membership id valid-shaped but no row in this org (already removed, or cross-org id). Repos filter by organization_id, so cross-tenant ids land here by design."

[ERR_ORG_004]
title = "Organization suspended"
status = 403
severity = "warning"
display = "page"
user_message = "This organization has been suspended."
action_step = "Contact support to resolve the suspension."
technical_context = "OrgSuspended — organizations.suspended_at is set; require_role blocks every /orgs/{org_id}/* route for all members. Set/cleared by platform admins via /admin/organizations/{id}/(un)suspend."

[ERR_ORG_005]
title = "Domain not claimable"
status = 400
severity = "info"
display = "toast"
user_message = "That domain can't be claimed for this organization."
action_step = "Use your company's own domain — it must match your email address, and shared providers like gmail.com aren't allowed."
technical_context = "DomainNotClaimable — normalize_claimable_domain rejected the claim: malformed domain, public mailbox provider, owner's email not on the domain, owner email unverified, or DOMAIN_CLAIM_MODE=off."

[ERR_ORG_006]
title = "Domain already claimed"
status = 409
severity = "info"
display = "toast"
user_message = "Another organization has already claimed that domain."
action_step = "If this is your company's domain, contact support to resolve the conflict."
technical_context = "DomainAlreadyClaimed — organizations.email_domain is unique; a different org row already holds this domain."

[ERR_ORG_007]
title = "Company workspace already exists"
status = 409
severity = "info"
display = "field"
user_message = "Your company already has a workspace."
action_step = "Verify your email to join automatically, or ask your company's workspace owner for an invitation."
technical_context = "DomainOrgExists — CreateOrganization blocked because an org already claims this user's email domain. The user should auto-join via email verification instead."

# ---------------------------------------------------------------- admin (audience: platform staff)

[ERR_ADM_001]
title = "User not found"
status = 404
severity = "info"
display = "toast"
user_message = "No user matches that id."
action_step = "Refresh the user list — the account may have been removed."
technical_context = "AdminUserNotFound — admin lookup by user id missed. Staff-facing copy; plainer than tenant-facing equivalents."

[ERR_ADM_002]
title = "Organization not found"
status = 404
severity = "info"
display = "toast"
user_message = "No organization matches that id."
action_step = "Refresh the organization list — it may have been deleted."
technical_context = "AdminOrgNotFound — admin lookup by org id missed. Unlike ERR_PERM_002, this is NOT masked: the caller is already a superuser."

[ERR_ADM_003]
title = "Cannot deactivate yourself"
status = 409
severity = "info"
display = "toast"
user_message = "You can't deactivate your own account from here."
action_step = "Ask another administrator to do it, so the platform is never left without an active admin."
technical_context = "CannotDeactivateSelf — self-deactivation guard on the admin users endpoint."

[ERR_ADM_004]
title = "Error record not found"
status = 404
severity = "info"
display = "toast"
user_message = "No error record matches that reference."
action_step = "Check the reference for typos — records also expire after 7 days."
technical_context = "AdminErrorRecordNotFound — /admin/errors/{error_id} lookup missed in Redis (expired errctx TTL or a mistyped reference)."

[ERR_ADM_005]
title = "Cannot impersonate a superuser"
status = 409
severity = "warning"
display = "toast"
user_message = "Superuser accounts can't be impersonated."
action_step = "Impersonation is for regular accounts only — coordinate with the other admin directly."
technical_context = "CannotImpersonateSuperuser — impersonation guard. Also covers self-impersonation (the acting user is a superuser by definition)."

[ERR_ADM_006]
title = "Cannot impersonate a deactivated user"
status = 409
severity = "info"
display = "toast"
user_message = "That account is deactivated, so it can't be impersonated."
action_step = "Reactivate the account first if you need to see it from the inside."
technical_context = "CannotImpersonateInactive — impersonation guard on users with is_active = false."

[ERR_ADM_007]
title = "Invitation not found"
status = 404
severity = "info"
display = "toast"
user_message = "No pending invitation matches that id."
action_step = "Refresh the invitations list — it may already be accepted or revoked."
technical_context = "AdminInvitationNotFound — cross-tenant invitation lookup missed, or the invitation was already accepted."

[ERR_ADM_008]
title = "Invalid merge"
status = 409
severity = "warning"
display = "toast"
user_message = "Cannot merge these organizations."
action_step = "The target and source organizations must be different, existing organizations."
technical_context = "MergeInvalid — admin org-merge guard: target not found, source not found, or source == target."

# ---------------------------------------------------------------- credits

[ERR_CRD_001]
title = "Not enough credits"
status = 409
severity = "info"
display = "toast"
user_message = "Your organization doesn't have enough credits for this."
user_message_specific = "This needs {required} credits, but your organization has {available}."
action_step = "Buy a credit pack, then try again."
technical_context = "InsufficientCredits — the reservation would take the org balance below zero. Sends `required` (action cost) and `available` (current balance) as params."
params = ["required", "available"]
alert = "A wave across many orgs after a deploy = an action's credit cost was misconfigured."

[ERR_CRD_002]
title = "Action already settled"
status = 409
severity = "info"
display = "toast"
user_message = "That action was already completed or cancelled."
action_step = "Refresh to see the current state — no credits were double-charged."
technical_context = "ReservationNotActive — finalize/cancel attempted on a non-active credit reservation. This is the double-settlement guard working as intended."

[ERR_CRD_003]
title = "Reservation not found"
status = 404
severity = "info"
display = "toast"
user_message = "We couldn't find that pending action."
action_step = "Refresh and try again from the start."
technical_context = "ReservationNotFound — reservation id missing for this org (repos filter by organization_id, so cross-tenant ids land here by design)."

[ERR_CRD_004]
title = "Unknown action"
status = 409
severity = "warning"
display = "toast"
user_message = "That action isn't available."
action_step = "Refresh the page — you may be on an older version of the app."
technical_context = "UnknownAction — credit-cost lookup for an action key that isn't in the pricing table. Usually a stale frontend bundle or a missing pricing entry for a newly shipped action."

[ERR_CRD_005]
title = "Unknown credit pack"
status = 409
severity = "warning"
display = "toast"
user_message = "That credit pack isn't available."
action_step = "Refresh the page and pick one of the listed packs."
technical_context = "UnknownCreditPack — a CreditPack value missing from the CREDIT_PACKS catalog. Stale frontend bundle, or webhook metadata referencing a pack that was removed from the catalog."

[ERR_CRD_006]
title = "Member credit limit reached"
status = 409
severity = "info"
display = "toast"
user_message = "You've reached your monthly credit limit for this organization."
action_step = "Ask an organization admin to raise your limit, or try again next month."
technical_context = "MemberCreditLimitExceeded — the acting user's captured + pending reservations this UTC calendar month plus the requested cost exceed member_credit_limits.monthly_limit. API-key charges are exempt (they carry no user_id). The error message includes used vs. requested amounts."

[ERR_CRD_007]
title = "Not an organization member"
status = 404
severity = "info"
display = "toast"
user_message = "That person isn't a member of this organization."
action_step = "Check the member list and try again."
technical_context = "LimitTargetNotMember — a member-limit set referenced a user_id with no membership in the org (removed member or wrong id)."

# ---------------------------------------------------------------- generations

[ERR_GEN_001]
title = "Generation not found"
status = 404
severity = "info"
display = "toast"
user_message = "We couldn't find that generation."
action_step = "Head back to your generations list — it may have been removed."
technical_context = "GenerationNotFound — generation id missing for this org."

[ERR_GEN_002]
title = "Generation not available"
status = 409
severity = "warning"
display = "toast"
user_message = "Content generation isn't set up on this server yet."
action_step = "If you run this deployment, configure the provider API keys (see README). Otherwise, contact your administrator."
technical_context = "ProviderNotConfigured — the generation provider's API key is empty. Expected in fresh dev environments; in production it's env misconfiguration."

[ERR_GEN_003]
title = "Generation failed"
status = 409
severity = "error"
display = "toast"
user_message = "We couldn't finish generating that, and your credits for it have been returned."
action_step = "Try again. If it keeps failing, tweak your input or contact support with the code below."
technical_context = "GenerationFailed — the provider call errored; the credit reservation is released (refund), which is what makes the 'credits returned' promise honest. Log the provider error verbatim."
alert = "Sustained rate = provider outage or a prompt/template regression — check provider status first."

[ERR_GEN_004]
title = "Still generating"
status = 409
severity = "info"
display = "toast"
user_message = "This is still being generated."
action_step = "Give it a few seconds — the result will appear when it's ready."
technical_context = "ResultNotReady — result fetched before the generation finished. Normal during polling; only worth attention if a generation never leaves this state."

[ERR_GEN_005]
title = "Can't cancel this"
status = 409
severity = "info"
display = "toast"
user_message = "This can only be canceled while it's still generating."
action_step = "It already finished — refresh to see the result."
technical_context = "NotCancelable — cancel requested on a non-pending generation. Usually a race between the user clicking cancel and the job finishing; harmless."

[ERR_GEN_006]
title = "Can't delete this yet"
status = 409
severity = "info"
display = "toast"
user_message = "Wait until this finishes before deleting it."
action_step = "Cancel it first, then delete it."
technical_context = "NotDeletable — delete requested on a still-pending generation. Deleting mid-flight would orphan the credit hold and the in-progress provider job; cancel handles those."

