technical_context = "StripeUnavailable — Stripe API connection error / 5xx / rate limit during checkout, portal, or customer creation. Log the stripe request id. 'You have not been charged' is the critical UX line — payment errors create disproportionate anxiety."
alert = "More than a handful in 5 minutes = Stripe incident or egress problem — check status.stripe.com."

