# ---------------------------------------------------------------- llm

[ERR_LLM_001]
title = "AI text provider not configured"
status = 409
severity = "warning"
display = "toast"
user_message = "This AI text provider isn't set up on this server yet."
action_step = "If you run this deployment, add the provider API key (see README). Otherwise, contact your administrator."
technical_context = "LlmProviderNotConfigured — GEMINI_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY empty for the requested provider. Raised before any credits are held."

[ERR_LLM_002]
title = "Text generation failed"
status = 409
severity = "error"
display = "toast"
