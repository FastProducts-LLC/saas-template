[ERR_LLM_003]
title = "Text completion not found"
status = 404
severity = "info"
display = "toast"
user_message = "We couldn't find that text completion."
action_step = "Head back to your completions list — it may have been removed."
technical_context = "LlmCallNotFound — llm call id missing for this org, or a non-UUID id was requested on the poll endpoint."

# ---------------------------------------------------------------- billing

[ERR_BILL_001]
title = "Billing not configured"
status = 409
severity = "warning"
display = "toast"
user_message = "Payments aren't set up on this server yet."
action_step = "If you run this deployment, add your Stripe keys (see README). Otherwise, contact your administrator."
