# ---------------------------------------------------------------- network (frontend-only)

[ERR_NET_001]
title = "You're offline"
status = 0
severity = "info"
display = "banner"
frontend_only = true
retry = { after_ms = 1500, max = 2 }
user_message = "We can't reach the internet right now."
action_step = "Check your connection — we'll retry automatically, and anything you typed is still here."
technical_context = "FRONTEND-ONLY: fetch() rejected (TypeError) — no response received, so no backend envelope exists. Synthesized by the api client. In dev, CORS failures also surface as TypeError — check the browser console."
